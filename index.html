<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Status Board</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .in-btn {
          background-color: #10B981; /* Emerald 500 */
          box-shadow: 0 6px 10px -2px rgba(16, 185, 129, 0.5);
        }
        .out-btn {
          background-color: #EF4444; /* Red 500 */
          box-shadow: 0 6px 10px -2px rgba(239, 68, 68, 0.5);
        }
        .status-button {
            transition: all 0.2s ease-in-out;
        }
        .status-button:hover {
            transform: scale(1.03);
        }
        .status-button:active {
            transform: scale(0.98);
        }
        .user-id {
            word-break: break-all;
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center p-4 sm:p-8">

    <div id="app-container" class="w-full max-w-4xl bg-white p-6 sm:p-10 rounded-xl shadow-2xl">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 mb-2 text-center">
            Flat Status Board
        </h1>
        <!-- NEW LIVE TIME DISPLAY -->
        <p id="current-time-display" class="text-center text-gray-400 mb-6 text-sm sm:text-base font-medium"></p>
        <!-- END NEW LIVE TIME DISPLAY -->

        <p class="text-center text-gray-500 mb-8 sm:mb-12 text-sm sm:text-base">
            Click your name to toggle your status: <span class="text-emerald-500 font-bold">In (Green)</span> or <span class="text-red-500 font-bold">Out (Red)</span>.
        </p>

        <div id="buttons-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-4 sm:gap-6">
            <!-- Status buttons will be rendered here by JavaScript -->
        </div>

        <div class="mt-12 p-4 border-t border-gray-200">
            <h3 class="text-lg font-semibold text-gray-700 mb-2">Technical Info</h3>
            <p class="text-gray-500 text-sm">
                <span class="font-medium">Project ID:</span> <span id="project-id-display">Connecting...</span>
            </p>
            <p class="text-gray-500 text-sm">
                <span class="font-medium">Connection Status:</span> <span id="connection-status-display">Attempting Connection...</span>
            </p>
            <p class="text-gray-500 text-sm">
                <span class="font-medium">Your User ID:</span> <span id="user-id-display" class="user-id">N/A (Anonymous)</span>
            </p>
        </div>
    </div>
    
    <div id="status-message" class="fixed bottom-4 right-4 bg-gray-800 text-white py-2 px-4 rounded-lg shadow-xl hidden"></div>

    <!-- Firebase SDK Imports (Removed unnecessary auth imports) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        // NOTE: We don't import getAnalytics here as we aren't using it in the core logic.

        // Enable Firestore Debug Logging
        setLogLevel('Debug');

        // =========================================================================
        // !!! USER'S NEW FIREBASE CONFIGURATION !!!
        // =========================================================================
        const projectId = "smcheckin-4cb2d"; // Updated Project ID
        const firebaseConfig = {
             apiKey: "AIzaSyCXEQYJthCXLNMlgVPmaLtyM72eimsQbJI",
             authDomain: "smcheckin-4cb2d.firebaseapp.com",
             projectId: projectId,
             storageBucket: "smcheckin-4cb2d.firebasestorage.app",
             messagingSenderId: "23298632157",
             appId: "1:23298632157:web:11d962a34c57e919332e34",
             measurementId: "G-YK6DR4N889"
        };

        // --- Core Application State ---
        let db = null;
        let auth = null;
        let members = [];
        let isSaving = false;
        let isFirstRender = true;
        let connectionSuccessful = false;
        
        // --- Firestore Path for Shared Public Data (MATCHES YOUR SECURITY RULES) ---
        // Uses the NEW projectId for the {appId} variable in the path.
        const FULL_FIREBASE_PATH = `/artifacts/${projectId}/public/data/roommate_status/flat_status_doc`; 

        // --- Initial Roommates List (9 members) ---
        const INITIAL_MEMBERS = [
            { id: 'k_ratana', name: 'K.Ratana', isIn: true },
            { id: 'p_taivo', name: 'P.Taivo', isIn: true },
            { id: 'b_makara', name: 'B.Makara', isIn: true },
            { id: 'k_sokheng', name: 'K.Sokheng', isIn: true },
            { id: 'c_choub', name: 'C.Choub', isIn: true },
            { id: 's_hean', name: 'S.Hean', isIn: true },
            { id: 't_sokleap', name: 'T.Sokleap', isIn: true },
            { id: 'c_loemheng', name: 'C.Loemheng', isIn: true },
            { id: 'm_meun', name: 'M.Meun', isIn: true },
        ];

        /**
         * Shows a temporary status message to the user (instead of alert()).
         * @param {string} message - The message to display.
         * @param {string} colorClass - Tailwind color class for background.
         */
        function showMessage(message, colorClass = 'bg-gray-800') {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = message;
            statusEl.className = `fixed bottom-4 right-4 text-white py-2 px-4 rounded-lg shadow-xl ${colorClass}`;
            statusEl.style.display = 'block';
            
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 3000);
        }
        
        // --- NEW: Function to update the clock display ---
        function updateClock() {
            const now = new Date();
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
            
            const timeString = now.toLocaleTimeString('en-US', timeOptions);
            const dateString = now.toLocaleDateString('en-US', dateOptions);

            const displayElement = document.getElementById('current-time-display');
            if (displayElement) {
                displayElement.textContent = `${dateString} | ${timeString}`;
            }
        }
        // --- END NEW FUNCTION ---


        /**
         * Renders all status buttons based on the current 'members' array.
         */
        function renderButtons() {
            const container = document.getElementById('buttons-container');
            // If connection is unsuccessful, use the initial list for rendering fallback
            const membersToRender = members.length > 0 ? members : INITIAL_MEMBERS;
            
            container.innerHTML = ''; // Clear existing buttons

            membersToRender.forEach(member => {
                const buttonContainer = document.createElement('div');
                buttonContainer.className = 'flex flex-col items-center';
                
                const button = document.createElement('button');
                button.textContent = member.name;
                
                // Determine if interaction is allowed (only if connection is established)
                if (connectionSuccessful) {
                    button.onclick = () => toggleStatus(member.id);
                } else {
                     button.onclick = () => showMessage("Not connected to database. Please check your Firebase setup.", 'bg-red-500');
                }

                // Determine classes based on status
                const baseClasses = 'status-button w-full h-24 sm:h-32 text-white font-bold text-lg sm:text-xl rounded-2xl focus:outline-none focus:ring-4 focus:ring-opacity-50';
                // Use member.isIn for color if available, otherwise default to in-btn (green)
                const isMemberIn = member.isIn !== undefined ? member.isIn : true; 
                const statusClasses = isMemberIn ? 'in-btn focus:ring-emerald-300' : 'out-btn focus:ring-red-300';

                button.className = `${baseClasses} ${statusClasses}`;
                button.setAttribute('aria-label', `Toggle status for ${member.name}. Current status: ${isMemberIn ? 'In' : 'Out'}`);
                
                buttonContainer.appendChild(button);
                container.appendChild(buttonContainer);
            });
            
            // Update UI elements
            document.getElementById('project-id-display').textContent = projectId;
            document.getElementById('connection-status-display').textContent = connectionSuccessful ? 'Connected' : 'Disconnected (Using Local Fallback)';
            document.getElementById('user-id-display').textContent = auth?.currentUser?.uid || 'N/A (Anonymous)';
        }

        /**
         * Updates a member's status locally and attempts to save it to Firestore.
         * @param {string} memberId - The ID of the member to toggle.
         */
        async function toggleStatus(memberId) {
            if (!db || isSaving || !connectionSuccessful) {
                showMessage("Database connection error. Cannot save.", 'bg-red-600');
                return;
            }
            
            isSaving = true;

            // Optimistic Update: Update the local state first
            const originalMembers = [...members]; // Copy for potential rollback
            const updatedMembers = members.map(m =>
                // FIX: Corrected map function to properly flip the 'isIn' property
                m.id === memberId ? { ...m, isIn: !m.isIn } : m
            );
            members = updatedMembers;
            renderButtons();

            try {
                // Use the FULL_FIREBASE_PATH which matches the security rules
                const statusDocRef = doc(db, FULL_FIREBASE_PATH);

                // Update Firestore
                await setDoc(statusDocRef, { members: updatedMembers });
                showMessage("Status updated successfully!", 'bg-green-600'); 
            } catch (error) {
                console.error("Error updating status in Firestore:", error);
                showMessage("Failed to save status. Check Firebase Rules.", 'bg-red-600');
                
                // Rollback: Revert to original state on failure
                members = originalMembers;
                renderButtons();
            } finally {
                isSaving = false;
            }
        }

        /**
         * Initializes Firebase, authenticates, and sets up the real-time listener.
         */
        async function initializeAppAndListener() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Authentication for public hosting: Sign in anonymously to satisfy 'request.auth != null'
                await signInAnonymously(auth);

                // Use the FULL_FIREBASE_PATH which matches the security rules
                const statusDocRef = doc(db, FULL_FIREBASE_PATH);

                // Set up Real-time Listener
                onSnapshot(statusDocRef, (docSnapshot) => {
                    connectionSuccessful = true;
                    if (docSnapshot.exists()) {
                        const data = docSnapshot.data();
                        // Only update if data is valid
                        if (Array.isArray(data.members)) {
                            members = data.members;
                        } else if (isFirstRender) {
                             // Initialize if the document is present but content is invalid/empty
                             setDoc(statusDocRef, { members: INITIAL_MEMBERS });
                        }
                        
                    } else {
                        // Data does not exist, initialize it in Firestore
                        console.log("Initializing data in Firestore...");
                        setDoc(statusDocRef, { members: INITIAL_MEMBERS });
                    }
                    
                    isFirstRender = false;
                    renderButtons();
                    document.getElementById('app-container').classList.remove('opacity-50', 'pointer-events-none');
                }, (err) => {
                    console.error("Firestore real-time error:", err);
                    connectionSuccessful = false;
                    showMessage("Real-time connection failed. Check your Firebase Rules.", 'bg-red-600');
                    renderButtons(); // Fallback render on error
                    document.getElementById('app-container').classList.remove('opacity-50', 'pointer-events-none');
                });

            } catch (error) {
                console.error("Application Initialization Failed:", error);
                connectionSuccessful = false;
                showMessage("Failed to start Firebase. Check your Config keys.", 'bg-red-600');
                renderButtons(); // Fallback render on error
            }
        }

        // 1. Render fallback buttons immediately to show the UI
        renderButtons(); 
        document.getElementById('app-container').classList.add('opacity-50', 'pointer-events-none');
        
        // 2. Start the clock immediately and update it every second
        updateClock();
        setInterval(updateClock, 1000);

        // 3. Start the Firebase connection when the window loads
        window.onload = initializeAppAndListener;
    </script>

</body>
</html>
